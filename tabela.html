<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatório de Diárias</title>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
        }

        /* Cabeçalho Ajustado */
        .topo {
            background: #003b75;
            color: white;
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topo h2 {
            margin: 0;
            text-transform: uppercase;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        /* Container para agrupar o brasão e o texto à direita */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .brasao {
            height: 70px;
            width: auto;
        }

        .texto-camara {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Layout Principal */
        .container {
            background: white;
            margin: 12px;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Controles e Filtros */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .toolbar-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select, button {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            background: #003b75;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #002a52;
        }

        /* Customização DataTables */
        table.dataTable thead th {
            background: #003b75 !important;
            color: white !important;
            text-transform: uppercase;
            font-size: 12px;
            padding: 12px;
        }

        /* Espaçamento entre o "Pesquisar" e a Tabela */
        .dataTables_wrapper .dataTables_filter,
        .dataTables_wrapper .dataTables_length {
            margin-bottom: 20px;
        }

        /* Ocultar o texto "Pesquisar:" mas manter a caixa de busca visível */
        .dataTables_wrapper .dataTables_filter label {
            font-size: 0; /* Esconde o texto escrito */
        }
        
        .dataTables_wrapper .dataTables_filter input {
            font-size: 14px; /* Garante que o que for digitado na caixa tenha o tamanho normal */
            margin-left: 0;
            padding: 6px 10px;
        }

        /* Realçar os ícones de ordenação (setas) */
        table.dataTable thead th.sorting::before,
        table.dataTable thead th.sorting::after,
        table.dataTable thead th.sorting_asc::before,
        table.dataTable thead th.sorting_asc::after,
        table.dataTable thead th.sorting_desc::before,
        table.dataTable thead th.sorting_desc::after {
            opacity: 0.4 !important;
        }

        /* Seta ativa (Crescente ou Decrescente) */
        table.dataTable thead th.sorting_asc::before,
        table.dataTable thead th.sorting_desc::after {
            opacity: 1 !important;
            color: #ffdd00 !important;
            text-shadow: 0 0 5px rgba(255, 221, 0, 0.5);
            font-size: 1.2em !important;
        }
    </style>
</head>

<body>

    <header class="topo">
        <h2>Relatório de Diárias</h2>
        
        <div class="logo-container">
            <img src="Brasão_de_Marília.png" alt="Brasão de Marília" class="brasao">
            <span class="texto-camara">Câmara Municipal de Marília</span>
        </div>
    </header>

    <main class="container">
        <div class="toolbar">
            <div class="toolbar-row">
                <select id="filtroServidor">
                    <option value="">Servidor</option>
                </select>

                <select id="filtroMes">
                    <option value="">Mês</option>
                    <option value="01">Janeiro</option>
                    <option value="02">Fevereiro</option>
                    <option value="03">Março</option>
                    <option value="04">Abril</option>
                    <option value="05">Maio</option>
                    <option value="06">Junho</option>
                    <option value="07">Julho</option>
                    <option value="08">Agosto</option>
                    <option value="09">Setembro</option>
                    <option value="10">Outubro</option>
                    <option value="11">Novembro</option>
                    <option value="12">Dezembro</option>
                </select>

                <select id="filtroAno">
                    <option value="">Ano</option>
                </select>

                <button onclick="limparFiltros()">Limpar filtros</button>
            </div>

            <div class="toolbar-row">
                <button onclick="exportarCSV()">Download CSV</button>
                <button onclick="exportarJSON()">Download JSON</button>
            </div>
        </div>

        <table id="tabela" class="display nowrap" style="width:100%">
            <thead>
                <tr>
                    <th>Servidor</th>
                    <th>Cargo</th>
                    <th>Nº Diárias</th>
                    <th>Valor Diárias</th>
                    <th>Adiantamento</th>
                    <th>Data Partida</th>
                    <th>Data Retorno</th>
                    <th>Destino</th>
                    <th>Cidade</th>
                    <th>Finalidade</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        const SHEET_ID = "1XP67Ojd_HK3S1IPvC_9eY32-lf0_qI3jfBfrLzasvQo";
        let tabela;
        let dadosGlobais = [];

        function getSheetUrl() {
            return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&t=${Date.now()}`;
        }

        function csvParaArray(str) {
            const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/; 
            const linhas = str.trim().split("\n");
            const cabecalho = linhas[0].split(regex).map(c => c.replace(/^"|"$/g, '').trim().toLowerCase());

            return linhas.slice(1).map(linha => {
                const valores = linha.split(regex);
                let obj = {};
                cabecalho.forEach((coluna, i) => {
                    obj[coluna] = (valores[i] || "").replace(/^"|"$/g, '').trim();
                });
                return obj;
            });
        }

        function extrairData(dataStr) {
            if (!dataStr) return {};
            const partes = dataStr.split("/");
            return { mes: partes[1], ano: partes[2] };
        }

        function formatarDataParaOrdenacao(dataStr) {
            if (!dataStr) return "00000000";
            const partes = dataStr.split("/");
            if (partes.length !== 3) return dataStr; 
            return `${partes[2]}${partes[1]}${partes[0]}`;
        }

        function formatarMoeda(valor) {
            if (!valor) return "";
            let valorLimpo = valor.trim();
            if (valorLimpo === "0" || valorLimpo === "0,00" || valorLimpo === "R$ 0,00" || valorLimpo === "0.00") return "-";
            
            valorLimpo = valorLimpo.replace(/R\$\s?/g, "").trim();
            if (!valorLimpo.includes(",")) {
                valorLimpo += ",00";
            } else {
                const casasDecimais = valorLimpo.split(",")[1];
                if (casasDecimais && casasDecimais.length === 1) valorLimpo += "0";
            }
            return `R$ ${valorLimpo}`;
        }

        function preencherFiltros() {
            const servidores = [...new Set(dadosGlobais.map(d => d.servidor))].sort();
            const anos = [...new Set(dadosGlobais.map(d => extrairData(d["data da partida"]).ano))].sort();
            servidores.forEach(s => { if(s) $('#filtroServidor').append(`<option value="${s}">${s}</option>`); });
            anos.forEach(a => { if (a) $('#filtroAno').append(`<option value="${a}">${a}</option>`); });
        }

        function render(dados) {
            let html = "";
            dados.forEach(d => {
                const ordemPartida = formatarDataParaOrdenacao(d["data da partida"]);
                const ordemRetorno = formatarDataParaOrdenacao(d["data do retorno"]);
                html += `
                    <tr>
                        <td>${d.servidor || ""}</td>
                        <td>${d["cargo ou função"] || ""}</td>
                        <td>${d["n de diárias"] || ""}</td>
                        <td>${formatarMoeda(d["valor diarias"])}</td>
                        <td>${formatarMoeda(d["valor adiantamento"])}</td>
                        <td data-sort="${ordemPartida}">${d["data da partida"] || ""}</td>
                        <td data-sort="${ordemRetorno}">${d["data do retorno"] || ""}</td>
                        <td>${d["local de destino"] || ""}</td>
                        <td>${d.cidade || ""}</td>
                        <td>${d.finalidade || ""}</td>
                    </tr>`;
            });

            if (tabela) tabela.destroy();
            $('#tabela tbody').html(html);
            
            tabela = $('#tabela').DataTable({
                pageLength: 10,
                scrollX: true,
                language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json' },
                initComplete: function() {
                    // Adiciona o texto cinza clarinho dentro da caixa de busca
                    $('.dataTables_filter input').attr('placeholder', 'Buscar na tabela...');
                }
            });
        }

        async function carregar() {
            try {
                const res = await fetch(getSheetUrl(), { cache: "no-store" });
                const csv = await res.text();
                dadosGlobais = csvParaArray(csv);
                preencherFiltros();
                render(dadosGlobais);
            } catch (erro) { console.error("Erro:", erro); }
        }

        function aplicarFiltros() {
            const serv = $('#filtroServidor').val();
            const mes = $('#filtroMes').val();
            const ano = $('#filtroAno').val();
            let filtrado = dadosGlobais.filter(d => {
                const dt = extrairData(d["data da partida"]);
                return (!serv || d.servidor === serv) && (!mes || dt.mes === mes) && (!ano || dt.ano === ano);
            });
            render(filtrado);
        }

        function limparFiltros() {
            $('#filtroServidor, #filtroMes, #filtroAno').val('');
            render(dadosGlobais);
        }

        function baixar(content, name, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = name; a.click();
            URL.revokeObjectURL(url);
        }

        function exportarCSV() {
            if (!dadosGlobais.length) return;
            const headers = Object.keys(dadosGlobais[0]);
            let csv = headers.join(",") + "\n";
            dadosGlobais.forEach(item => {
                const linha = headers.map(h => `"${(item[h] || "").replace(/"/g, '""')}"`);
                csv += linha.join(",") + "\n";
            });
            baixar(csv, "diarias.csv", "text/csv");
        }

        function exportarJSON() {
            baixar(JSON.stringify(dadosGlobais, null, 2), "diarias.json", "application/json");
        }

        $('#filtroServidor, #filtroMes, #filtroAno').on('change', aplicarFiltros);

        window.onload = async function () {
            await carregar();
            const hoje = new Date();
            $('#filtroMes').val(String(hoje.getMonth() + 1).padStart(2, "0"));
            $('#filtroAno').val(String(hoje.getFullYear()));
            aplicarFiltros();
        };
    </script>
</body>
</html>
