<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatório de Diárias</title>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
        }

        /* --- CABEÇALHO --- */
        .topo {
            background: #003b75;
            color: white;
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topo h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .brasao { height: 70px; width: auto; }
        .texto-camara { font-size: 12px; font-weight: bold; letter-spacing: 0.5px; }

        /* --- CARREGAMENTO (LOADING) --- */
        #loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            font-size: 16px;
            color: #003b75;
            font-weight: bold;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #003b75;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- LAYOUT PRINCIPAL --- */
        .container {
            background: white;
            margin: 12px;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: none; /* Escondido até carregar os dados */
        }

        .toolbar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .toolbar-row { display: flex; gap: 10px; flex-wrap: wrap; }

        select, button {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            background: #003b75;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button:hover { background: #002a52; }
        
        .btn-acao { background: #17a2b8; }
        .btn-acao:hover { background: #138496; }

        /* --- TABELA DATATABLES --- */
        table.dataTable thead th {
            background: #003b75 !important;
            color: white !important;
            text-transform: uppercase;
            font-size: 12px;
            padding: 12px;
        }
        
        table.dataTable tfoot th {
            background: #f4f6f9 !important;
            color: #003b75 !important;
            font-size: 14px;
            font-weight: bold;
            padding: 12px;
            border-top: 2px solid #003b75;
        }

        .dataTables_wrapper .dataTables_filter,
        .dataTables_wrapper .dataTables_length { margin-bottom: 20px; }
        .dataTables_wrapper .dataTables_filter label { font-size: 0; }
        .dataTables_wrapper .dataTables_filter input { font-size: 14px; margin-left: 0; padding: 6px 10px; }

        table.dataTable thead th.sorting::before, table.dataTable thead th.sorting::after,
        table.dataTable thead th.sorting_asc::before, table.dataTable thead th.sorting_asc::after,
        table.dataTable thead th.sorting_desc::before, table.dataTable thead th.sorting_desc::after {
            opacity: 0.4 !important;
        }

        table.dataTable thead th.sorting_asc::before, table.dataTable thead th.sorting_desc::after {
            opacity: 1 !important; color: #ffdd00 !important; text-shadow: 0 0 5px rgba(255, 221, 0, 0.5); font-size: 1.2em !important;
        }

        /* --- MODO IMPRESSÃO --- */
        @media print {
            body { background: white; margin: 0; padding: 0; }
            .topo, .toolbar, .dataTables_filter, .dataTables_length, .dataTables_info, .dataTables_paginate { display: none !important; }
            .container { box-shadow: none; margin: 0; padding: 0; width: 100%; }
            table.dataTable { border-collapse: collapse !important; width: 100% !important; }
            table.dataTable th, table.dataTable td { border: 1px solid #ddd !important; font-size: 10px !important; padding: 6px !important; }
            tr { page-break-inside: avoid; }
        }
    </style>
</head>

<body>

    <header class="topo">
        <h1>Relatório de Diárias</h1>
        <div class="logo-container">

                <select id="filtroMes">

                <button onclick="exportarXLSX()">⬇️ Excel</button>
                <button onclick="exportarJSON()">⬇️ JSON</button>
                <button class="btn-acao" onclick="window.print()">🖨️ Imprimir</button>
                <button class="btn-acao" onclick="iniciarCarregamento()">🔄 Atualizar Dados</button>

        <table id="tabela" class="display nowrap" style="width:100%">

            <tbody></tbody>

            </tfoot>
        </table>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

    <script>
        const SHEET_ID = "1XP67Ojd_HK3S1IPvC_9eY32-lf0_qI3jfBfrLzasvQo";
        let tabela;
        let dadosGlobais = [];
        let dadosFiltrados = [];

        function getSheetUrl() { return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&t=${Date.now()}`; }

        function csvParaArray(str) {
            const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/; 
            const linhas = str.trim().split("\n");
            const cabecalho = linhas[0].split(regex).map(c => c.replace(/^"|"$/g, '').trim().toLowerCase());
            return linhas.slice(1).map(linha => {
                const valores = linha.split(regex);
                let obj = {};
                cabecalho.forEach((coluna, i) => { obj[coluna] = (valores[i] || "").replace(/^"|"$/g, '').trim(); });
                return obj;
            });
        }

        function extrairData(dataStr) {
            if (!dataStr) return {};
            const partes = dataStr.split("/");
            return { mes: partes[1], ano: partes[2] };
        }

        function formatarDataParaOrdenacao(dataStr) {
            if (!dataStr) return "00000000";
            const partes = dataStr.split("/");
            if (partes.length !== 3) return dataStr; 
            return `${partes[2]}${partes[1]}${partes[0]}`;
        }

        function formatarMoeda(valor) {
            if (!valor) return "";
            let valorLimpo = valor.trim();
            if (valorLimpo === "0" || valorLimpo === "0,00" || valorLimpo === "R$ 0,00" || valorLimpo === "0.00") return "-";
            
            valorLimpo = valorLimpo.replace(/R\$\s?/g, "").trim();
            if (!valorLimpo.includes(",")) {
                valorLimpo += ",00";
            } else {
                const casasDecimais = valorLimpo.split(",")[1];
                if (casasDecimais && casasDecimais.length === 1) valorLimpo += "0";
            }
            return `R$ ${valorLimpo}`;
        }

        // Função útil para ignorar acentos (ex: Júnior == Junior)
        function removerAcentos(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function preencherFiltros() {
            const valServidor = $('#filtroServidor').val();
            const valAno = $('#filtroAno').val();
            const valGabinete = $('#filtroGabinete').val();

            $('#filtroServidor').html('<option value="">Servidor</option>');
            $('#filtroAno').html('<option value="">Ano</option>');
            $('#filtroGabinete').html('<option value="">Gabinete</option>');

            const servidores = [...new Set(dadosGlobais.map(d => d.servidor))].sort();
            const anos = [...new Set(dadosGlobais.map(d => extrairData(d["data da partida"]).ano))].sort();
            
            // Lógica para extrair intel
