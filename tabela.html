<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Relatório de Diárias</title>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

    <style>
        body {
            font-family: Inter, Arial;
            margin: 0;
            background: #f4f6f9;
        }

        .topo {
            background: #003b75;
            color: white;
            text-align: center;
            padding: 14px;
        }

        .container {
            background: white;
            margin: 12px;
            padding: 12px;
            border-radius: 10px;
        }

        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .toolbar-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select, button {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #003b75;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #002a52;
        }

        table.dataTable thead th {
            background: #003b75 !important;
            color: white !important;
            text-transform: uppercase;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="topo">
        <h2>Relatório de Diárias</h2>
    </div>

    <div class="container">

        <!-- TOOLBAR -->
        <div class="toolbar">

            <!-- FILTROS -->
            <div class="toolbar-row">
                <select id="filtroServidor">
                    <option value="">Servidor</option>
                </select>

                <select id="filtroMes">
                    <option value="">Mês</option>
                    <option value="01">Janeiro</option>
                    <option value="02">Fevereiro</option>
                    <option value="03">Março</option>
                    <option value="04">Abril</option>
                    <option value="05">Maio</option>
                    <option value="06">Junho</option>
                    <option value="07">Julho</option>
                    <option value="08">Agosto</option>
                    <option value="09">Setembro</option>
                    <option value="10">Outubro</option>
                    <option value="11">Novembro</option>
                    <option value="12">Dezembro</option>
                </select>

                <select id="filtroAno">
                    <option value="">Ano</option>
                </select>

                <button onclick="limparFiltros()">Limpar filtros</button>
            </div>

            <!-- EXPORTAÇÃO -->
            <div class="toolbar-row">
                <button onclick="exportarCSV()">Download CSV</button>
                <button onclick="exportarJSON()">Download JSON</button>
            </div>

        </div>

        <table id="tabela" class="display nowrap" style="width:100%">
            <thead>
                <tr>
                    <th>Servidor</th>
                    <th>Cargo</th>
                    <th>Nº Diárias</th>
                    <th>Valor Diárias</th>
                    <th>Adiantamento</th>
                    <th>Data Partida</th>
                    <th>Data Retorno</th>
                    <th>Destino</th>
                    <th>Cidade</th>
                    <th>Finalidade</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        const SHEET_ID = "SEU_ID_AQUI";

        let tabela;
        let dadosGlobais = [];

        function getSheetUrl() {
            return `https://docs.google.com/spreadsheets/d/1XP67Ojd_HK3S1IPvC_9eY32-lf0_qI3jfBfrLzasvQo/export?format=csv&t=${Date.now()}`;
        }

        function csvParaArray(str) {
            const linhas = str.trim().split("\n");
            const cab = linhas[0].split(",");

            return linhas.slice(1).map(l => {
                const vals = l.split(",");
                let obj = {};

                cab.forEach((c, i) => {
                    obj[c.trim()] = (vals[i] || "").trim();
                });

                return obj;
            });
        }

        function extrairData(data) {
            if (!data) return {};
            const p = data.split("/");

            return {
                mes: p[1],
                ano: p[2]
            };
        }

        function preencherFiltros() {
            const servidores = [...new Set(dadosGlobais.map(d => d.servidor))];
            const anos = [...new Set(dadosGlobais.map(d => extrairData(d["data da partida"]).ano))];

            servidores.forEach(s => {
                $('#filtroServidor').append(`<option value="${s}">${s}</option>`);
            });

            anos.forEach(a => {
                if (a) $('#filtroAno').append(`<option value="${a}">${a}</option>`);
            });
        }

        function render(dados) {
            let html = "";

            dados.forEach(d => {
                html += `
                    <tr>
                        <td>${d.servidor || ""}</td>
                        <td>${d["cargo ou função"] || ""}</td>
                        <td>${d["n de diárias"] || ""}</td>
                        <td>${d["valor diarias"] || ""}</td>
                        <td>${d["valor adiantamento"] || ""}</td>
                        <td>${d["data da partida"] || ""}</td>
                        <td>${d["data do retorno"] || ""}</td>
                        <td>${d["local de destino"] || ""}</td>
                        <td>${d.cidade || ""}</td>
                        <td>${d.finalidade || ""}</td>
                    </tr>
                `;
            });

            $('#tabela tbody').html(html);

            if (!tabela) {
                tabela = $('#tabela').DataTable({
                    pageLength: 10,
                    scrollX: true
                });
            } else {
                tabela.clear().destroy();
                tabela = $('#tabela').DataTable();
            }
        }

        async function carregar() {
            const res = await fetch(getSheetUrl(), { cache: "no-store" });
            const csv = await res.text();

            dadosGlobais = csvParaArray(csv);

            preencherFiltros();
            render(dadosGlobais);
        }

        function aplicarFiltros() {
            const serv = $('#filtroServidor').val();
            const mes = $('#filtroMes').val();
            const ano = $('#filtroAno').val();

            let filtrado = dadosGlobais;

            if (serv) filtrado = filtrado.filter(d => d.servidor === serv);

            if (mes || ano) {
                filtrado = filtrado.filter(d => {
                    const dt = extrairData(d["data da partida"]);
                    return (!mes || dt.mes === mes) && (!ano || dt.ano === ano);
                });
            }

            render(filtrado);
        }

        $('#filtroServidor, #filtroMes, #filtroAno').on('change', aplicarFiltros);

        function limparFiltros() {
            $('#filtroServidor, #filtroMes, #filtroAno').val('');
            render(dadosGlobais);
        }

        function exportarCSV() {
            const headers = Object.keys(dadosGlobais[0] || {});
            let csv = headers.join(",") + "\n";

            dadosGlobais.forEach(item => {
                const linha = headers.map(h => `"${(item[h] || "").replace(/"/g, '""')}"`);
                csv += linha.join(",") + "\n";
            });

            baixar(csv, "diarias.csv", "text/csv");
        }

        function exportarJSON() {
            baixar(JSON.stringify(dadosGlobais, null, 2), "diarias.json", "application/json");
        }

        function baixar(content, name, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = name;
            a.click();

            URL.revokeObjectURL(url);
        }

        function aplicarFiltroAtualPadrao() {
            const hoje = new Date();

            const mes = String(hoje.getMonth() + 1).padStart(2, "0");
            const ano = String(hoje.getFullYear());

            if (!$('#filtroMes').val() && !$('#filtroAno').val()) {
                $('#filtroMes').val(mes);
                $('#filtroAno').val(ano);
            }

            aplicarFiltros();
        }

        window.onload = async function () {
            await carregar();
            aplicarFiltroAtualPadrao();
        };
    </script>

</body>
</html>
