<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Relatório de Diárias</title>

    <!-- DataTables -->
    <link rel="stylesheet"
        href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

    <link rel="stylesheet"
        href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f1f1f1;
        }

        .topo {
            background: #003b75;
            color: white;
            text-align: center;
            padding: 14px;
        }

        .container {
            background: white;
            padding: 10px;
            overflow-x: auto;
        }

        table.dataTable thead th {
            background: #003b75 !important;
            color: white !important;
            text-transform: uppercase;
        }

        table.dataTable tbody td {
            font-size: 12px;
        }

        .dt-button {
            background: #003b75 !important;
            color: white !important;
            border: none !important;
        }
    </style>
</head>

<body>

    <div class="topo">
        <h2>Relatório de Diárias</h2>
    </div>

    <div class="container">

        <table id="tabela" class="display nowrap" style="width:100%">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Cargo</th>
                    <th>Nº Diárias</th>
                    <th>Valor Recebido</th>
                    <th>Data Partida</th>
                    <th>Data Retorno</th>
                    <th>Destino</th>
                    <th>Motivação</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

    </div>

    <!-- JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        // 📊 ID da planilha Google Sheets
        const SHEET_ID = "1XP67Ojd_HK3S1IPvC_9eY32-lf0_qI3jfBfrLzasvQo";

        // 🔄 URL com anti-cache (PRO)
        function getSheetUrl() {
            return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&t=${new Date().getTime()}`;
        }

        let tabela;

        // 🧠 converte CSV em JSON
        function csvParaArray(str) {
            const linhas = str.trim().split("\n");
            const cabecalho = linhas[0].split(",");

            return linhas.slice(1).map(linha => {
                const valores = linha.split(",");
                let obj = {};

                cabecalho.forEach((col, i) => {
                    obj[col.trim()] = (valores[i] || "").trim();
                });

                return obj;
            });
        }

        // 🚀 carrega dados da planilha
        async function carregarDados() {

            const res = await fetch(getSheetUrl(), {
                cache: "no-store"
            });

            const csv = await res.text();

            const dados = csvParaArray(csv);

            let linhas = "";

            dados.forEach(item => {
                linhas += `
                    <tr>
                        <td>${item.nome || ""}</td>
                        <td>${item.cargo || ""}</td>
                        <td>${item["n de diarias"] || ""}</td>
                        <td>${item["valor recebido"] || ""}</td>
                        <td>${item["data da partida"] || ""}</td>
                        <td>${item["data do retorno"] || ""}</td>
                        <td>${item.destino || ""}</td>
                        <td>${item.motivacao || ""}</td>
                    </tr>
                `;
            });

            document.querySelector("#tabela tbody").innerHTML = linhas;

            if (!tabela) {
                tabela = $('#tabela').DataTable({
                    dom: 'Bfrtip',
                    pageLength: 10,
                    scrollX: true,
                    language: {
                        search: "Pesquisa:"
                    }
                });
            } else {
                tabela.destroy();
                tabela = $('#tabela').DataTable();
            }

            ajustarAlturaIframe();
        }

        // 📏 ajuste automático para iframe (Plone 4)
        function ajustarAlturaIframe() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    tipo: "ajustarAltura",
                    altura: document.body.scrollHeight
                }, "*");
            }
        }

        window.addEventListener("load", carregarDados);

        // 🔄 atualização periódica (opcional)
        setInterval(carregarDados, 60000);

    </script>

</body>

</html>
