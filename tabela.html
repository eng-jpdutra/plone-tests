<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Relatório de Diárias</title>

    <link rel="stylesheet"
        href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f1f1f1;
        }

        .topo {
            background: #003b75;
            color: white;
            text-align: center;
            padding: 14px;
        }

        .container {
            background: white;
            padding: 10px;
            overflow-x: auto;
        }

        table.dataTable thead th {
            background: #003b75 !important;
            color: white !important;
            text-transform: uppercase;
            font-size: 12px;
        }

        table.dataTable tbody td {
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="topo">
        <h2>Relatório de Diárias</h2>
    </div>

    <div class="container">

        <table id="tabela" class="display nowrap" style="width:100%">

            <thead>
                <tr>
                    <th>Servidor</th>
                    <th>Cargo / Função</th>
                    <th>Nº Diárias</th>
                    <th>Valor Diárias</th>
                    <th>Valor Adiantamento</th>
                    <th>Data Partida</th>
                    <th>Data Retorno</th>
                    <th>Local de Destino</th>
                    <th>Cidade</th>
                    <th>Finalidade</th>
                </tr>
            </thead>

            <tbody></tbody>

        </table>

    </div>

    <!-- JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        const SHEET_ID = "SEU_ID_AQUI";

        function getSheetUrl() {
            return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&t=${new Date().getTime()}`;
        }

        let tabela;

        function csvParaArray(str) {
            const linhas = str.trim().split("\n");
            const cabecalho = linhas[0].split(",");

            return linhas.slice(1).map(linha => {
                const valores = linha.split(",");
                let obj = {};

                cabecalho.forEach((col, i) => {
                    obj[col.trim()] = (valores[i] || "").trim();
                });

                return obj;
            });
        }

        async function carregarDados() {

            const res = await fetch(getSheetUrl(), { cache: "no-store" });
            const csv = await res.text();

            const dados = csvParaArray(csv);

            let linhas = "";

            dados.forEach(item => {
                linhas += `
                    <tr>
                        <td>${item.servidor || ""}</td>
                        <td>${item["cargo ou função"] || ""}</td>
                        <td>${item["n de diárias"] || ""}</td>
                        <td>${item["valor diarias"] || ""}</td>
                        <td>${item["valor adiantamento"] || ""}</td>
                        <td>${item["data da partida"] || ""}</td>
                        <td>${item["data do retorno"] || ""}</td>
                        <td>${item["local de destino"] || ""}</td>
                        <td>${item.cidade || ""}</td>
                        <td>${item.finalidade || ""}</td>
                    </tr>
                `;
            });

            document.querySelector("#tabela tbody").innerHTML = linhas;

            if (!tabela) {
                tabela = $('#tabela').DataTable({
                    dom: 'Bfrtip',
                    pageLength: 10,
                    scrollX: true,
                    language: {
                        search: "Pesquisa:"
                    }
                });
            } else {
                tabela.destroy();
                tabela = $('#tabela').DataTable();
            }

            ajustarAlturaIframe();
        }

        function ajustarAlturaIframe() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    tipo: "ajustarAltura",
                    altura: document.body.scrollHeight
                }, "*");
            }
        }

        window.addEventListener("load", carregarDados);
        setInterval(carregarDados, 60000);
    </script>

</body>

</html>
